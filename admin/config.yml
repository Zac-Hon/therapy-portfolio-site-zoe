backend:
  name: git-gateway
  branch: main

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "home"
    label: "Home Page"
    files:
      - file: "content/home.json"
        label: "Home Page"
        name: "home"
        fields:
          - { name: "title", label: "Title", widget: "string" }
          - { name: "headline", label: "Headline", widget: "string" }
          - { name: "subheadline", label: "Subheadline", widget: "string" }
          - { name: "body", label: "Body (HTML)", widget: "text" }

  - name: "about"
    label: "About Page"
    files:
      - file: "content/about.json"
        label: "About Page"
        name: "about"
        fields:
          - { name: "title", label: "Title", widget: "string" }
          - { name: "body", label: "Body (HTML)", widget: "text" }

  - name: "services"
    label: "Services"
    files:
      - file: "content/services.json"
        label: "Services"
        name: "services"
        fields:
          - { name: "title", label: "Title", widget: "string" }
          - {
              name: "services",
              label: "Services",
              widget: "list",
              fields:
                [
                  { name: "name", label: "Service Name", widget: "string" },
                  { name: "description", label: "Description", widget: "text" },
                  { name: "duration", label: "Duration", widget: "string", required: false },
                  { name: "price", label: "Price", widget: "string", required: false },
                ],
            }

  - name: "settings"
    label: "Site Settings"
    files:
      - file: "content/settings.json"
        label: "Site Settings"
        name: "settings"
        fields:
          - { name: "therapist_name", label: "Therapist Name", widget: "string" }
          - { name: "location", label: "Location", widget: "string" }
          - { name: "email", label: "Email", widget: "string" }
          - { name: "phone", label: "Phone", widget: "string", required: false }
          - { name: "profile_image", label: "Profile Image", widget: "image", required: false }

  - name: "professional"
    label: "Professional Profile"
    files:
      - file: "content/professional.json"
        label: "Professional Profile"
        name: "professional"
        fields:
          - label: "Therapeutic Approach"
            name: "approach"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Eyebrow", widget: "string" }
              - { name: "title", label: "Title", widget: "string" }
              - { name: "body", label: "Body", widget: "text" }
              - { name: "principles", label: "Principles", widget: "list", field: { name: "principle", label: "Principle", widget: "string" } }
          - label: "Who I Work With"
            name: "whoIWorkWith"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Eyebrow", widget: "string" }
              - { name: "title", label: "Title", widget: "string" }
              - { name: "body", label: "Body", widget: "text" }
              - { name: "concerns", label: "Concerns", widget: "list", field: { name: "concern", label: "Concern", widget: "string" } }
          - label: "Qualifications"
            name: "qualifications"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Eyebrow", widget: "string" }
              - { name: "title", label: "Title", widget: "string" }
              - { name: "body", label: "Body", widget: "text" }
              - { name: "details", label: "Details", widget: "list", field: { name: "detail", label: "Detail", widget: "string" } }

  - name: "site"
    label: "Site Copy"
    files:
      - file: "content/site.json"
        label: "Site Copy"
        name: "site"
        fields:
          - label: "Navigation"
            name: "navigation"
            widget: "object"
            fields:
              - { name: "home", label: "Home", widget: "string" }
              - { name: "about", label: "About", widget: "string" }
              - { name: "services", label: "Services", widget: "string" }
              - { name: "approach", label: "Approach", widget: "string" }
              - { name: "whoIWorkWith", label: "Who I Work With", widget: "string" }
              - { name: "qualifications", label: "Qualifications", widget: "string" }
              - { name: "contact", label: "Contact", widget: "string" }
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { name: "ctaLabel", label: "Button Label", widget: "string" }
          - label: "About Section"
            name: "about"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Eyebrow", widget: "string" }
              - { name: "supportingText", label: "Supporting Text", widget: "text" }
              - { name: "ctaLabel", label: "CTA Label", widget: "string" }
          - label: "Services Section"
            name: "services"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Eyebrow", widget: "string" }
              - { name: "intro", label: "Introduction", widget: "text" }
              - { name: "durationLabel", label: "Duration Label", widget: "string" }
              - { name: "priceLabel", label: "Price Label", widget: "string" }
              - { name: "ctaLabel", label: "CTA Label", widget: "string" }
          - label: "Contact Section"
            name: "contact"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Eyebrow", widget: "string" }
              - { name: "title", label: "Title", widget: "string" }
              - { name: "intro", label: "Introduction", widget: "text" }
              - { name: "emailLabel", label: "Email Label", widget: "string" }
              - { name: "locationLabel", label: "Location Label", widget: "string" }
              - { name: "phoneLabel", label: "Phone Label", widget: "string" }
              - { name: "nameLabel", label: "Name Field Label", widget: "string" }
              - { name: "formEmailLabel", label: "Email Field Label", widget: "string" }
              - { name: "messageLabel", label: "Message Field Label", widget: "string" }
              - { name: "submitLabel", label: "Submit Button Label", widget: "string" }
          - label: "Footer"
            name: "footer"
            widget: "object"
            fields:
              - { name: "description", label: "Description (use {location})", widget: "string" }
              - { name: "closingNote", label: "Closing Note", widget: "string" }
