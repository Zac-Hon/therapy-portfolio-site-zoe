backend:
  name: git-gateway
  branch: main

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "home"
    label: "Home Page"
    file: "content/home.json"
    fields:
      - { name: "title", label: "Title", widget: "string" }
      - { name: "headline", label: "Headline", widget: "string" }
      - { name: "subheadline", label: "Subheadline", widget: "string" }
      - { name: "body", label: "Body (HTML)", widget: "text" }

  - name: "about"
    label: "About Page"
    file: "content/about.json"
    fields:
      - { name: "title", label: "Title", widget: "string" }
      - { name: "body", label: "Body (HTML)", widget: "text" }

  - name: "services"
    label: "Services"
    file: "content/services.json"
    fields:
      - { name: "title", label: "Title", widget: "string" }
      - {
          name: "services",
          label: "Services",
          widget: "list",
          fields:
            [
              { name: "name", label: "Service Name", widget: "string" },
              { name: "description", label: "Description", widget: "text" },
              { name: "duration", label: "Duration", widget: "string", required: false },
              { name: "price", label: "Price", widget: "string", required: false },
            ],
        }

  - name: "settings"
    label: "Site Settings"
    file: "content/settings.json"
    fields:
      - { name: "therapist_name", label: "Therapist Name", widget: "string" }
      - { name: "location", label: "Location", widget: "string" }
      - { name: "email", label: "Email", widget: "string" }
      - { name: "phone", label: "Phone", widget: "string", required: false }
      - { name: "profile_image", label: "Profile Image", widget: "image", required: false }
